name: CodeQL Weekly Triage

# Gives code scanning alerts an owner and a cadence. Alert #63 was found by
# CodeQL the day it was introduced and then sat open for five months because
# nobody was assigned to look (INC-2026-001). Every Monday this opens one issue,
# assigned to the security owner, listing the open critical/high alerts; the
# owner fixes or dismisses each with a reason and closes the issue. The issue
# history is the record that triage happened.

on:
  schedule:
    # Mondays, US morning.
    - cron: '23 15 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  security-events: read

concurrency:
  group: codeql-triage
  cancel-in-progress: false

env:
  # Security owner: Tejas Chopra (tejas@headroomlabs.ai).
  TRIAGE_ASSIGNEE: chopratejas

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure security label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "security" \
            --repo "${{ github.repository }}" \
            --color "b60205" \
            --description "Security-relevant; exempt from stale triage" \
            --force

      - name: Open weekly triage issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          week="$(date -u +%Y-%m-%d)"
          alerts="$(gh api --paginate -X GET "repos/$REPO/code-scanning/alerts" -f state=open \
            --jq '.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high")
                  | "- [ ] [#\(.number)](\(.html_url)) **\(.rule.security_severity_level)** `\(.rule.id)` in `\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)` (open since \(.created_at[:10]))"')"
          count="$(printf '%s' "$alerts" | grep -c '^- ' || true)"
          {
            echo "Weekly code scanning triage for the week of **$week**. Owner: @$TRIAGE_ASSIGNEE (tejas@headroomlabs.ai)."
            echo
            echo "For each alert: fix it (link the PR) or dismiss it in code scanning with a reason. Close this issue when every box is ticked."
            echo "Target: critical and high fixed or dismissed within the vulnerability management SLA."
            echo
            echo "### Open critical/high alerts: $count"
            echo
            if [ "$count" -eq 0 ]; then echo "None. Close this issue to record the review."; else printf '%s\n' "$alerts"; fi
            echo
            echo "All open alerts: https://github.com/$REPO/security/code-scanning"
          } > body.md
          gh issue create --repo "$REPO" \
            --title "CodeQL triage: week of $week ($count critical/high open)" \
            --body-file body.md \
            --assignee "$TRIAGE_ASSIGNEE" \
            --label security
